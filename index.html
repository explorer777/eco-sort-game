<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Врятуй Землю! | EcoSortGame</title>
    <!-- Іконка вбудована, щоб не завантажувати окремий файл -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2349b6e8'/><path d='M22 40q14-24 34-14t-4 26-18 24-12-36zM62 56q18-8 22 4t-14 20-8-24z' fill='%2355b447'/></svg>">
    <style>
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      /* ---------- Гра: 16:9 по центру, чорний фон, без скролу ---------- */
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      #unity-container {
        position: fixed !important; inset: 0;
        width: 100% !important; height: 100% !important;
        transform: none !important;
        display: flex; align-items: center; justify-content: center;
      }
      #unity-canvas {
        display: block; outline: none; background: #000;
        width: min(100vw, 177.78vh) !important;
        height: min(100vh, 56.25vw) !important;
      }
      /* На телефонах vh не враховує адресний рядок, тому, де можна, беремо dvh */
      @supports (height: 100dvh) {
        #unity-canvas {
          width: min(100vw, 177.78dvh) !important;
          height: min(100dvh, 56.25vw) !important;
        }
      }

      /* ---------- Листівка ---------- */
      #landing, #loading {
        position: fixed; inset: 0; height: 100vh; height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; transition: opacity .6s ease;
      }
      #landing {
        z-index: 20; background: #6ccaff;
        --u: min(1vw, 1.78vh); /* 1% ширини вікна 16:9 */
      }
      @supports (height: 100dvh) { #landing { --u: min(1vw, 1.78dvh); } }
      #loading { z-index: 10; }
      .fade { opacity: 0; pointer-events: none; }

      .scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .cloud { animation: drift 24s ease-in-out infinite alternate; }
      .cloud.slow { animation-duration: 34s; }
      .leaf { animation: fall 18s linear infinite; }
      .smoke { animation: smoke-a 10s linear infinite; }
      .smoke.two { animation: smoke-b 6.8s linear infinite; }

      .card {
        --line: clamp(3px, calc(var(--u) * .24), 5px);
        position: relative; flex: none;
        width: clamp(280px, calc(var(--u) * 36), 760px);
        padding: clamp(14px, calc(var(--u) * 1.9), 42px) clamp(14px, calc(var(--u) * 2), 44px) clamp(18px, calc(var(--u) * 2.3), 50px);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; background: #fff;
        border: var(--line) solid #2b2b2b; border-radius: clamp(18px, calc(var(--u) * 1.9), 40px);
        box-shadow: 0 clamp(5px, calc(var(--u) * .65), 14px) clamp(10px, calc(var(--u) * 1.2), 26px) rgba(27, 27, 27, .32);
        font-family: "Segoe UI", system-ui, sans-serif;
        animation: appear .8s cubic-bezier(.2, .8, .3, 1) both;
      }
      .card h1 {
        margin: 0; line-height: 1.15; font-weight: 700; color: #2f9e2f; white-space: nowrap;
        font-size: clamp(26px, calc(var(--u) * 3.4), 72px);
        -webkit-text-stroke: clamp(.5px, calc(var(--u) * .07), 1.5px) #1d5f1d;
      }
      .card .sub {
        margin: clamp(2px, calc(var(--u) * .25), 6px) 0 clamp(12px, calc(var(--u) * 1.4), 30px); color: #3d5a40;
        font-size: clamp(14px, calc(var(--u) * 1.35), 30px);
      }
      #start-btn {
        --w: clamp(180px, calc(var(--u) * 17), 340px);
        --drop: clamp(4px, calc(var(--u) * .36), 8px);
        position: relative; cursor: pointer; padding: 0 0 .06em; margin-bottom: var(--drop);
        width: var(--w); height: calc(var(--w) * .26);
        border: var(--line) solid #2b2b2b; border-radius: 999px;
        font: inherit; font-weight: 700; font-size: clamp(20px, calc(var(--u) * 2.6), 52px); line-height: 1;
        color: #1b5e20; background: linear-gradient(180deg, #ffd27a 0%, #ffb02e 45%, #f58a0a 100%) border-box;
        box-shadow: 0 var(--drop) 0 calc(var(--line) * -1) #c8700a, 0 var(--drop) 0 0 #2b2b2b;
        transition: transform .15s, filter .15s;
      }
      #start-btn::before {
        content: ""; position: absolute; left: 8%; top: 8%; width: 68%; height: 9.5%;
        border-radius: 999px; background: #fff; opacity: .75;
      }
      #start-btn:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.05); }
      #start-btn:active { transform: translateY(calc(var(--drop) * .6)); }
      #start-btn:focus-visible { outline: 3px solid #1f6b35; outline-offset: 12px; }
      .btn {
        border: 0; border-radius: 999px; cursor: pointer;
        padding: .55em 1.7em; font: inherit; font-weight: 800;
        font-size: clamp(1.25rem, 5vmin, 3.6rem);
        color: #fff; background: linear-gradient(180deg, #f9862b, #dd5a08);
        box-shadow: 0 6px 18px rgba(200, 80, 0, .4);
        transition: transform .15s, filter .15s;
      }
      .btn:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.06); }
      .btn:active { transform: scale(.97); }
      .btn:focus-visible, #fs-btn:focus-visible { outline: 3px solid #1f6b35; outline-offset: 3px; }

      /* ---------- Екран завантаження ---------- */
      #loading { flex-direction: column; gap: 18px; padding: 24px; color: #fff; background: #12351f; text-align: center; }
      #loading-text { margin: 0; font-size: clamp(1rem, 3.4vmin, 1.5rem); }
      #bar { width: min(80vw, 460px); height: 18px; border-radius: 999px; background: rgba(255, 255, 255, .18); overflow: hidden; }
      #bar-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8fd14f, #f9a13b); transition: width .2s; }

      /* ---------- Кнопка повного екрана і повідомлення Unity ---------- */
      #fs-btn {
        position: fixed; z-index: 5;
        right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
        width: 40px; height: 40px; padding: 0; border: 0; border-radius: 10px; cursor: pointer;
        font-size: 22px; line-height: 1; color: #fff; background: rgba(0, 0, 0, .45); opacity: .55;
      }
      #fs-btn:hover { opacity: 1; }
      #banner { position: fixed; z-index: 30; top: 12px; left: 50%; transform: translateX(-50%); max-width: 90vw; }
      #banner div { margin-bottom: 6px; padding: 10px 14px; border-radius: 10px; background: #fff; color: #222; white-space: pre-line; }
      #banner .warning { background: #ffe27a; }
      #banner .error { background: #b3261e; color: #fff; }

      @keyframes appear { from { opacity: 0; transform: translateY(26px) scale(.96); } }
      @keyframes drift { to { transform: translateX(110px); } }
      @keyframes fall {
        from { transform: translate(var(--x), -80px) rotate(0deg); }
        50% { transform: translate(calc(var(--x) + 70px), 530px) rotate(130deg); }
        to { transform: translate(var(--x), 1140px) rotate(300deg); }
      }
      @keyframes smoke-a {
        0% { transform: translate(1632px, 462px) scale(.5); opacity: 0; }
        12% { transform: translate(1632px, 440px) scale(.9); opacity: 1; }
        38% { transform: translate(1668px, 380px) scale(1.1); }
        64% { transform: translate(1730px, 310px) scale(1.35); }
        90% { transform: translate(1810px, 250px) scale(1.55); opacity: 1; }
        100% { transform: translate(1845px, 225px) scale(1.65); opacity: 0; }
      }
      @keyframes smoke-b {
        0% { transform: translate(1724px, 414px) scale(.5); opacity: 0; }
        15% { transform: translate(1726px, 392px) scale(.9); opacity: 1; }
        80% { transform: translate(1778px, 322px) scale(1.15); opacity: 1; }
        100% { transform: translate(1800px, 296px) scale(1.25); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Гра -->

    </div>
    <button id="fs-btn" type="button" title="Повний екран" aria-label="Повний екран" hidden>⛶</button>

    <!-- Екран завантаження -->

      <p id="loading-text" role="status">Завантаження гри…</p>
      <div id="bar" role="progressbar" aria-label="Завантаження гри" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="bar-fill"></div>
      </div>
      <button id="retry-btn" class="btn" type="button" hidden>Спробувати ще раз</button>
    </div>

    <!-- Листівка -->

    <div id="banner"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const canvas = $("unity-canvas");
      const root = document.documentElement;
      let gameRunning = false;

      // Повідомлення Unity: помилки лишаються, решта зникає за 5 секунд
      function unityShowBanner(msg, type) {
        const div = document.createElement("div");
        div.className = type || "";
        div.textContent = msg;
        $("banner").appendChild(div);
        if (type !== "error") setTimeout(() => div.remove(), 5000);
      }

      // Назви файлів збірки підставляє Unity
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/123.loader.js";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/123.data",
        frameworkUrl: buildUrl + "/123.framework.js",
        codeUrl: buildUrl + "/123.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "EcoSortGame",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // ---------- Повний екран ----------
      const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
      const requestFs = root.requestFullscreen || root.webkitRequestFullscreen; // на iPhone немає

      function enterFullscreen() {
        if (!requestFs || isFullscreen()) return;
        try {
          const result = requestFs.call(root);
          if (result && result.catch) result.catch(() => {}); // відмова браузера: граємо у вікні
        } catch (e) { /* граємо у вікні */ }
      }

      // Кнопка «⛶» видима лише тоді, коли гра запущена у вікні
      function updateFsButton() {
        $("fs-btn").hidden = !gameRunning || !requestFs || isFullscreen();
      }
      document.addEventListener("fullscreenchange", updateFsButton);
      document.addEventListener("webkitfullscreenchange", updateFsButton);
      $("fs-btn").addEventListener("click", () => { enterFullscreen(); canvas.focus(); });

      // ---------- Завантаження гри ----------
      function setProgress(p) {
        const percent = Math.round(p * 100);
        $("bar-fill").style.width = percent + "%";
        $("bar").setAttribute("aria-valuenow", percent);
        $("loading-text").textContent = "Завантаження гри… " + percent + "%";
      }

      function showLoadError(err) {
        console.error(err);
        $("loading-text").textContent = "Не вдалося завантажити гру. Перевірте інтернет і спробуйте ще раз.";
        $("bar").hidden = true;
        $("retry-btn").hidden = false;
      }
      $("retry-btn").addEventListener("click", () => location.reload());

      function loadGame() {
        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onerror = () => showLoadError("Не знайдено " + loaderUrl);
        script.onload = () => {
          createUnityInstance(canvas, config, setProgress).then(() => {
            gameRunning = true;
            hideScreen($("loading"));
            updateFsButton();
            canvas.focus();
          }).catch(showLoadError);
        };
        document.body.appendChild(script);
      }

      // Плавно ховає екран, потім прибирає його зі сторінки
      function hideScreen(el) {
        el.classList.add("fade");
        setTimeout(() => { el.hidden = true; }, 650);
      }

      // ---------- Кнопка «Почати» ----------
      $("start-btn").addEventListener("click", () => {
        enterFullscreen();            // першим, поки діє жест користувача
        $("loading").hidden = false;
        hideScreen($("landing"));
        loadGame();
      }, { once: true });
    </script>
